apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-tpu-server
  labels:
    app: vllm-tpu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-tpu
  template:
    metadata:
      labels:
        app: vllm-tpu
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
      - name: vllm-container
        image: vllm/vllm-openai:latest # Or a custom image with JAX/TPU optimizations
        command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
        args:
          - "--model=google/gemma-2-9b"
          - "--device=tpu"
          - "--enable-lora"
          - "--max-loras=20"
          - "--max-lora-rank=32"
          - "--max-cpu-loras=50"
          - "--trust-remote-code"
          - "--max-model-len=4096"
        ports:
        - containerPort: 8000
        resources:
          limits:
            google.com/tpu: "4" # Requesting 4 TPU chips (v5e)
        env:
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-service
spec:
  selector:
    app: vllm-tpu
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: LoadBalancer
